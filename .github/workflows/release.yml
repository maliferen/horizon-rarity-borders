name: CI and Release Horizon Native Mod

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-test:
    name: Verify & Test Native Mod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mod repository
        uses: actions/checkout@v4
        with:
          path: mod

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run unit tests
        run: cargo test --manifest-path mod/Cargo.toml --verbose

      - name: Check code formatting across all mixin files
        run: |
          find mod/mixins -name "*.rs" -exec rustfmt --edition 2024 --check {} +

      - name: Run clippy
        run: cargo clippy --manifest-path mod/Cargo.toml -- -D warnings

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout Horizon Mods tools
        uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon-mods
          path: horizon-mods
          sparse-checkout: |
            native/tools
            native/Cargo.toml

      - name: Link mod into Horizon Mods workspace
        run: |
          mkdir -p horizon-mods/native
          ln -s "$GITHUB_WORKSPACE/mod" horizon-mods/native/rarity-borders

      - name: Install system dependencies for Horizon build
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Run official native.py check
        run: |
          cd horizon-mods
          python3 native/tools/native.py check rarity-borders

      - name: Package .hnmod bundle
        run: |
          python3 mod/package.py --mod-dir mod --out dist

      - name: Verify SHA-256
        id: hash
        run: |
          sha=$(sha256sum dist/*.hnmod | awk '{print $1}')
          echo "Package SHA-256: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rarity_borders-hnmod
          path: dist/*.hnmod

  publish-release:
    name: Publish GitHub Release
    needs: check-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: rarity_borders-hnmod
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.hnmod
          generate_release_notes: true
          draft: false
          prerelease: false
